<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>鴈行對戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  --ink:#15110e;--panel:#1b140f;--card:#251b13;--paper:#f2e7d1;--dim:#c2b08f;--bronze:#d6a94e;--gold:#ffe3a8;--line:#5a4630;
  --blue:#2f5fae;--blueL:#8fb4ff;--red:#b0331f;--redL:#ff9a86;--ok:#2f9a5e;--warn:#c97a1a;
  --display:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --ui:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --sideW:min(390px,40vw);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}

/* ===== 戰場與側欄（側欄不蓋戰場） ===== */
#stage{position:fixed;left:0;top:0;bottom:0;right:var(--sideW);touch-action:none}
#gl{width:100%;height:100%;display:block;cursor:grab}
#stageBtns{position:absolute;right:calc(10px + env(safe-area-inset-right,0px)*0);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.sbtn{font:700 13px var(--display);letter-spacing:.08em;color:var(--paper);background:rgba(22,17,14,.82);border:1px solid rgba(214,169,78,.5);border-radius:8px;padding:7px 10px}
#net{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top,0px));font-size:12px;color:#9be7b4;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px;pointer-events:none;transition:opacity 1s}
#net.off,#net.err{color:#ffb0a0}#net.fade{opacity:0}
#side{position:fixed;top:0;right:0;bottom:0;width:var(--sideW);display:flex;flex-direction:column;gap:9px;overflow:auto;
  padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) 12px;
  background:linear-gradient(180deg,#1d150f,#140f0b);border-left:1px solid var(--line)}
@media (orientation:portrait){#toast{top:calc(42% + 8px);left:12px;right:12px;width:auto}#stage{right:0;bottom:auto;height:42%}#side{top:42%;left:0;width:auto;border-left:0;border-top:1px solid var(--line)}}
@media (max-height:500px) and (orientation:landscape){:root{--sideW:min(360px,48vw)}#side{gap:6px;padding-top:calc(6px + env(safe-area-inset-top,0px))}}

.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{font:900 15px var(--display);letter-spacing:.1em;padding:4px 10px;border-radius:6px;color:#fff}
.who.blue{background:var(--blue)}.who.red{background:var(--red)}.who.ref{background:#7a5a20}.who.proj{background:#3a3a46}.who.ai{background:#3a4a3a}
.round{font:900 15px var(--display);color:var(--gold)}
.grow{flex:1}
.mini{font-size:12px;color:var(--dim)}
.tbtn{font-size:12px;color:var(--paper);background:#2a2018;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.card{border:1px solid rgba(214,169,78,.35);border-radius:10px;background:var(--card);padding:10px 12px;display:grid;gap:7px;font-size:13.5px;line-height:1.6}
.card h3{font-size:15px;color:var(--bronze);letter-spacing:.08em}
.card p{margin:0}
.kick{margin:0;font-size:11.5px;letter-spacing:.2em;color:var(--dim)}
.sit{display:grid;gap:3px;font-size:13px}
.sit div::before{content:"・";color:var(--bronze)}
.card.form{border-color:#6f8fd0;background:#1c2233;gap:3px}
.report .fn{font:900 15px var(--display);color:#ffe3a8;margin:0;min-height:1.4em}
.card.form .fn{font:900 17px var(--display);letter-spacing:.08em;color:#cfe0ff}
body.side-red .card.form{border-color:#d07a6a;background:#2e1a16}body.side-red .report .fn{font:900 15px var(--display);color:#ffe3a8;margin:0;min-height:1.4em}
.card.form .fn{color:#ffd9d0}
.report{border-color:#e0b45a;background:#2e2214;box-shadow:0 0 0 1px rgba(255,210,120,.2)}
.report ol{margin:0;padding-left:20px;display:grid;gap:3px}
.report .res{font:900 16px var(--display);color:var(--gold)}
.grp{display:grid;gap:5px}
.grp>b{font-size:13px;color:var(--gold);font-family:var(--display)}
.opts{display:grid;gap:5px}
.o{display:grid;gap:1px;text-align:left;color:var(--paper);background:#2c2117;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.o.dg{grid-template-columns:96px 1fr;align-items:center;gap:9px;padding:6px 9px 6px 6px}
.o .ot{display:grid;gap:1px;min-width:0}
.osv{width:96px;height:112px;display:block;border-radius:6px;border:1px solid #3a2c1f}
.osv .sl{font:700 6px var(--ui);fill:#ffe3a8;text-anchor:middle}
.o b{font:900 15px var(--display);letter-spacing:.06em;color:#fff1d0}
.o span{font-size:12.5px;color:var(--dim);line-height:1.5}
.o.on{background:#1d3560;border-color:var(--blueL);box-shadow:0 0 0 1px var(--blueL) inset}
.o.on span{color:#d6e2ff}
.o.on b::before{content:"✓ "}
body.side-red .o.on{background:#5a1d14;border-color:var(--redL);box-shadow:0 0 0 1px var(--redL) inset}
body.side-red .o.on span{color:#ffd9d0}
.note{font-size:12.5px;color:#ffcf8a;margin:0}
.send{font:900 16px var(--display);letter-spacing:.25em;color:#fff;border:0;border-radius:6px;padding:10px;background:linear-gradient(180deg,#e04a35,#a82518);box-shadow:0 3px 0 #5e140c}
.send.ok{background:linear-gradient(180deg,#3fa66a,#1f7a45);box-shadow:0 3px 0 #0f4024;letter-spacing:.05em}
.send:disabled{opacity:.75}
.btn{font:700 14px var(--display);color:var(--paper);background:#2a2018;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.btn.main{background:var(--bronze);color:#1a120a;border-color:#ffe29a}
.btn.blue{background:var(--blue);border-color:var(--blueL);color:#fff}.btn.red{background:var(--red);border-color:var(--redL);color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 auto}
.stat{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.stat .k{color:var(--dim)}
.okc{color:#8ee0a8}.waitc{color:#ffcf8a}
.log{font-size:12.5px;display:grid;gap:6px;max-height:260px;overflow:auto}
.log b{color:var(--gold);font-family:var(--display)}
.rv p{margin:0 0 4px}
.rv h4{margin:6px 0 2px;font:900 14px var(--display);color:var(--bronze)}
details.card summary{cursor:pointer;font:900 14px var(--display);color:var(--bronze);letter-spacing:.08em}
details.card ul{margin:0;padding-left:18px;display:grid;gap:3px}

/* ===== 全螢幕頁（首頁、QR 碼、揭曉） ===== */
.page{position:fixed;inset:0;overflow:auto;background:radial-gradient(120% 90% at 50% 0%,#2a1d12,#120d09 70%);z-index:30;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:14px}
.title{font:900 clamp(30px,6vw,46px) var(--display);letter-spacing:.2em;color:var(--bronze)}
.subt{color:var(--dim);font-size:14px;line-height:1.7}
.menu{display:grid;gap:10px}
.mbtn{display:grid;gap:3px;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#241a12;color:var(--paper)}
.mbtn b{font:900 19px var(--display);letter-spacing:.1em;color:var(--gold)}
.mbtn span{font-size:13px;color:var(--dim);line-height:1.6}
.mbtn.hi{border-color:#e0b45a;background:#2f2213}
input.code{font:900 22px var(--display);letter-spacing:.3em;text-transform:uppercase;width:9em;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#120d09;color:var(--gold)}
/* QR 頁 */
.qrtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qrtabs button{font:900 18px var(--display);letter-spacing:.15em;padding:12px 0;border-radius:10px;border:1px solid var(--line);background:#241a12;color:var(--paper)}
.qrtabs button.on.blue{background:var(--blue);border-color:var(--blueL)}.qrtabs button.on.red{background:var(--red);border-color:var(--redL)}.qrtabs button.on.proj{background:#4a4a5a;border-color:#aab}
.qrbox{display:grid;justify-items:center;gap:10px;background:#f6efe0;color:#1a120a;border-radius:16px;padding:18px}
.qrbox svg{width:min(70vh,82vw,560px);height:auto;display:block}
.qrbox .lab{font:900 clamp(22px,4vw,34px) var(--display);letter-spacing:.2em}
.qrbox .url{font-size:13px;word-break:break-all;text-align:center;color:#4a3a28;user-select:all}
.joins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:14px}
.joins div{background:#241a12;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
/* 揭曉頁 */
.rev h2{font-size:22px;color:var(--bronze);letter-spacing:.12em}
.rev section{display:grid;gap:8px;background:#211810;border:1px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.75;font-size:14.5px}
.rev blockquote{margin:0;padding:6px 12px;border-left:3px solid var(--bronze);background:#2a1f15;border-radius:0 8px 8px 0}
.rev blockquote b{font-family:var(--display);color:var(--gold);font-size:15.5px}
.rev blockquote small{display:block;color:var(--dim);font-size:12.5px}
.rev ol{margin:0;padding-left:22px;display:grid;gap:6px}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stages div{background:#2a1f15;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;line-height:1.5}
.stages b{display:block;font:900 15px var(--display);color:var(--gold)}
@media (max-width:560px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}.joins{grid-template-columns:1fr}}
#toast{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));width:calc(var(--sideW) - 24px);top:calc(10px + env(safe-area-inset-top,0px));z-index:60;background:#1d8c4a;color:#fff;font-weight:700;padding:8px 16px;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#120d09;color:var(--dim);z-index:70;font-size:15px}
</style>
</head>
<body>
<div id="loading">載入中…</div>
<div id="stage" hidden><canvas id="gl"></canvas><div id="net" hidden></div>
  <div id="stageBtns"><button type="button" class="sbtn" id="bSty">換畫風</button><button type="button" class="sbtn" id="bHome">回到全局</button></div></div>
<aside id="side" hidden></aside>
<div id="page" class="page" hidden></div>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js?v=1"></script>
<script src="rules.js?v=1"></script>
<script src="ai.js?v=1"></script>
<script src="review.js?v=1"></script>
<script src="layout.js?v=1"></script>
<script src="world.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
